<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharkot - Painel Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
    <aside class="sidebar">
        <!-- LOCAL DA LOGO DO ADMIN DA SPECIAL CORE -->
        <div class="admin-logo-container">
            <img src="logo-admin-special-core.png" alt="Logo Admin Special Core" id="admin-logo">
        </div>
        <ul class="admin-menu">
            <li><a href="#" class="active">Dashboard</a></li>
            <li><a href="#">Usuários</a></li>
            <li><a href="#">Configurações</a></li>
            <li><a href="index.html">Sair</a></li>
        </ul>
    </aside>

    <main class="admin-content">
        <header class="admin-header">
            <!-- LOCAL DA LOGO DA SPECIAL CORE CONVENCIONAL -->
            <div class="brand-logo-container">
                <img src="logo-special-core.png" alt="Logo Special Core" id="brand-logo">
            </div>
            <h2>Painel Administrativo</h2>
        </header>

        <section class="dashboard-grid">
            <div class="dash-card">
                <h3>Usuários Totais</h3>
                <p>1,240</p>
            </div>
            <div class="dash-card">
                <h3>Assinantes Premium</h3>
                <p>320</p>
            </div>
            <div class="dash-card">
                <h3>Status do Servidor</h3>
                <p class="status-online">Online</p>
            </div>
        </section>
    </main>
</body>
</html>
