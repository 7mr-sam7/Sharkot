<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharkot - Perfil Personalizável</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="profile-bg-convencional" id="main-background"> <!-- O fundo branco (convencional muda cor, premium muda cor/foto/GIF) -->

    <div class="profile-wrapper">
        
        <!-- BANNER 1 (Bloco Rosa do modelo) -->
        <div class="banner-block banner-rosa" id="banner-1">
            <!-- Convencional: Apenas cor sólida. Premium: Até 3 imagens/GIFs ou cor -->
        </div>

        <!-- FOTO CENTRAL (A Bola Verde do modelo) -->
        <div class="profile-avatar-container" id="avatar-container" style="background-color: #00ff00;">
            <!-- Convencional: Foto estática + cor da bola. Premium: GIF na foto + cor -->
            <img src="default-avatar.png" alt="Foto de Perfil" id="avatar-img">
        </div>

        <!-- BANNER 2 (Bloco Azul do modelo) -->
        <div class="banner-block banner-azul" id="banner-2">
            <!-- Convencional: Apenas cor sólida. Premium: Até 3 imagens/GIFs ou cor -->
        </div>

    </div>

    <!-- Informações básicas do usuário -->
    <div class="profile-info-card">
        <h2>7mr-sam7</h2>
        <p class="badge-status">Membro Convencional / <a href="premium.html">Seja Premium</a></p>
    </div>

</body>
</html>
